<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To' Rico | Tienda Online</title>
  <style>
    :root {
      --primary: #e65100;
      --primary-dark: #b23b00;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --gray: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 1.5rem 1rem;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    header h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
    header p { font-size: 0.9rem; opacity: 0.9; }

    .delivery-banner {
      background: #fff3e0;
      color: #b23b00;
      border-left: 4px solid var(--primary);
      margin: 1rem;
      padding: 0.8rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1rem 0.5rem;
      gap: 8px;
    }
    .btn-action {
      background: white;
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .categories {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 0.5rem 1rem;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-pill {
      background: white;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--gray);
    }
    .cat-pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      padding: 1rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      background: #eee;
    }
    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
    .card h3 { font-size: 0.95rem; margin-bottom: 4px; }
    .card .category-tag { font-size: 0.7rem; color: var(--gray); text-transform: uppercase; }
    .prices { margin: 8px 0; }
    .price-cup { font-weight: bold; font-size: 1.1rem; color: var(--primary); }
    .price-usd { font-size: 0.8rem; color: var(--gray); }
    .btn-add {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
    }

    .floating-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
    }
    .btn-whatsapp {
      background: #25d366;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.95rem;
    }

    /* Modal Admin */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: white;
      border-radius: var(--radius);
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .preview-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>To' Rico 😉</h1>
    <p>Catálogo Digital de Compras</p>
  </header>

  <div class="delivery-banner">
    <div>🛵 <strong>Envío a domicilio:</strong> 250 CUP</div>
    <div>⏱️ <strong>Tiempo estimado:</strong> 3 a 5 horas</div>
  </div>

  <div class="top-actions">
    <button class="btn-action" onclick="compartirCatalogo()">🔗 Compartir catálogo</button>
    <button class="btn-action" onclick="abrirAdmin()">⚙️ Panel Admin</button>
  </div>

  <div class="categories" id="catList">
    <button class="cat-pill active" onclick="filtrarCategoria('Todas')">Todas</button>
    <button class="cat-pill" onclick="filtrarCategoria('Aseo')">Aseo</button>
    <button class="cat-pill" onclick="filtrarCategoria('Alimentos')">Alimentos</button>
    <button class="cat-pill" onclick="filtrarCategoria('Bebidas')">Bebidas</button>
    <button class="cat-pill" onclick="filtrarCategoria('Electrodomésticos')">Electrodomésticos</button>
    <button class="cat-pill" onclick="filtrarCategoria('Útiles de hogar')">Útiles de hogar</button>
  </div>

  <div class="grid" id="productGrid"></div>

  <div class="floating-bar">
    <div>
      <div style="font-size: 0.8rem; color: var(--gray);">Total seleccionado:</div>
      <strong id="cartTotal">0 CUP (0.00 USD)</strong>
    </div>
    <button class="btn-whatsapp" onclick="enviarPedidoWhatsApp()">Pedir por WhatsApp</button>
  </div>

  <!-- Modal Admin -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Administración de To' Rico</h3>
        <button style="border:none; background:none; font-size:1.2rem; cursor:pointer;" onclick="cerrarAdmin()">✕</button>
      </div>

      <div class="form-group" style="background: #f1f5f9; padding: 10px; border-radius: 8px;">
        <label>Tasa de cambio (1 USD en CUP):</label>
        <div style="display:flex; gap: 8px;">
          <input type="number" id="tasaCambioInput" value="320">
          <button class="btn-action" onclick="guardarTasa()">Guardar Tasa</button>
        </div>
      </div>

      <h4 style="margin: 1rem 0 0.5rem;">Agregar Nuevo Producto</h4>
      <div class="form-group">
        <label>Nombre:</label>
        <input type="text" id="prodNombre" placeholder="Ej. Detergente en polvo">
      </div>
      <div class="form-group">
        <label>Categoría:</label>
        <select id="prodCat">
          <option value="Aseo">Aseo</option>
          <option value="Alimentos">Alimentos</option>
          <option value="Bebidas">Bebidas</option>
          <option value="Electrodomésticos">Electrodomésticos</option>
          <option value="Útiles de hogar">Útiles de hogar</option>
        </select>
      </div>
      <div class="form-group">
        <label>Precio en USD:</label>
        <input type="number" step="0.01" id="prodPrecioUSD" placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Foto desde la galería:</label>
        <input type="file" id="prodImg" accept="image/*" onchange="cargarImagenPreview(event)">
        <img id="previewImg" class="preview-img" alt="Vista previa">
      </div>
      <button class="btn-action" style="width:100%; background:var(--primary); color:white; justify-content:center;" onclick="agregarProducto()">Guardar Producto</button>

      <h4 style="margin: 1.5rem 0 0.5rem;">Productos en Catálogo</h4>
      <div id="adminProductList" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>

  <script>
    const CLAVE_ADMIN = "1234"; // Cambia esta contraseña por la tuya
    const TELEFONO_WHATSAPP = "5350000000"; // Pon aquí tu número con código de país (ej. 53 para Cuba)

    let tasaCambio = parseFloat(localStorage.getItem('toRico_tasa')) || 320;
    let productos = JSON.parse(localStorage.getItem('toRico_prods')) || [
      { id: 1, nombre: "Jabón de tocador", cat: "Aseo", usd: 0.80, img: "" },
      { id: 2, nombre: "Arroz (bolsa 1kg)", cat: "Alimentos", usd: 1.50, img: "" },
      { id: 3, nombre: "Refresco de lata", cat: "Bebidas", usd: 0.90, img: "" }
    ];
    let carrito = [];
    let categoriaActiva = "Todas";
    let imagenBase64 = "";

    function init() {
      document.getElementById('tasaCambioInput').value = tasaCambio;
      renderCatalogo();
    }

    function renderCatalogo() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = "";
      const lista = categoriaActiva === "Todas" ? productos : productos.filter(p => p.cat === categoriaActiva);

      lista.forEach(prod => {
        const precioCup = Math.round(prod.usd * tasaCambio);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${prod.img || 'https://via.placeholder.com/200?text=Sin+Foto'}" alt="${prod.nombre}">
          <div class="card-body">
            <div>
              <span class="category-tag">${prod.cat}</span>
              <h3>${prod.nombre}</h3>
            </div>
            <div class="prices">
              <div class="price-cup">${precioCup.toLocaleString()} CUP</div>
              <div class="price-usd">$${prod.usd.toFixed(2)} USD</div>
            </div>
            <button class="btn-add" onclick="agregarAlCarrito(${prod.id})">+ Agregar</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filtrarCategoria(cat) {
      categoriaActiva = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === cat);
      });
      renderCatalogo();
    }

    function agregarAlCarrito(id) {
      const prod = productos.find(p => p.id === id);
      carrito.push(prod);
      actualizarCarrito();
    }

    function actualizarCarrito() {
      const totalUSD = carrito.reduce((sum, p) => sum + p.usd, 0);
      const totalCUP = Math.round(totalUSD * tasaCambio);
      document.getElementById('cartTotal').innerText = `${totalCUP.toLocaleString()} CUP ($${totalUSD.toFixed(2)} USD)`;
    }

    function compartirCatalogo() {
      if (navigator.share) {
        navigator.share({
          title: "To' Rico - Catálogo de Ventas",
          text: "¡Echa un vistazo a nuestros productos disponibles en To' Rico! Envíos en 3 a 5 horas.",
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert("Enlace copiado al portapapeles. Ya puedes pegarlo en WhatsApp o Facebook.");
      }
    }

    function enviarPedidoWhatsApp() {
      if (carrito.length === 0) {
        alert("Agrega al menos un producto al carrito.");
        return;
      }
      let itemsAgrupados = {};
      carrito.forEach(p => {
        itemsAgrupados[p.nombre] = (itemsAgrupados[p.nombre] || 0) + 1;
      });

      let texto = `*Nuevo Pedido - To' Rico*\n\n`;
      let totalUSD = 0;
      for (const [nombre, cant] of Object.entries(itemsAgrupados)) {
        const prod = productos.find(p => p.nombre === nombre);
        const subtotal = prod.usd * cant;
        totalUSD += subtotal;
        texto += `• ${cant}x ${nombre} - $${subtotal.toFixed(2)} USD (${Math.round(subtotal * tasaCambio)} CUP)\n`;
      }

      const totalCUP = Math.round(totalUSD * tasaCambio);
      const domicilio = 250;
      texto += `\n*Subtotal:* ${totalCUP.toLocaleString()} CUP ($${totalUSD.toFixed(2)} USD)`;
      texto += `\n*Domicilio (3-5 hrs):* ${domicilio} CUP`;
      texto += `\n*TOTAL A PAGAR:* ${(totalCUP + domicilio).toLocaleString()} CUP`;

      const url = `https://wa.me/${TELEFONO_WHATSAPP}?text=${encodeURIComponent(texto)}`;
      window.open(url, '_blank');
    }

    /* Funciones de Administración */
    function abrirAdmin() {
      const pass = prompt("Introduce la clave de administración:");
      if (pass === CLAVE_ADMIN) {
        document.getElementById('adminModal').classList.add('open');
        renderAdminList();
      } else if (pass !== null) {
        alert("Contraseña incorrecta.");
      }
    }

    function cerrarAdmin() {
      document.getElementById('adminModal').classList.remove('open');
    }

    function guardarTasa() {
      const val = parseFloat(document.getElementById('tasaCambioInput').value);
      if (val > 0) {
        tasaCambio = val;
        localStorage.setItem('toRico_tasa', tasaCambio);
        renderCatalogo();
        actualizarCarrito();
        alert("Tasa de cambio actualizada.");
      }
    }

    function cargarImagenPreview(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          imagenBase64 = evt.target.result;
          const img = document.getElementById('previewImg');
          img.src = imagenBase64;
          img.style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    }

    function agregarProducto() {
      const nombre = document.getElementById('prodNombre').value.trim();
      const cat = document.getElementById('prodCat').value;
      const usd = parseFloat(document.getElementById('prodPrecioUSD').value);

      if (!nombre || isNaN(usd)) {
        alert("Completa el nombre y el precio.");
        return;
      }

      productos.push({
        id: Date.now(),
        nombre,
        cat,
        usd,
        img: imagenBase64
      });

      localStorage.setItem('toRico_prods', JSON.stringify(productos));
      renderCatalogo();
      renderAdminList();

      document.getElementById('prodNombre').value = "";
      document.getElementById('prodPrecioUSD').value = "";
      document.getElementById('prodImg').value = "";
      document.getElementById('previewImg').style.display = "none";
      imagenBase64 = "";
    }

    function eliminarProducto(id) {
      if (confirm("¿Seguro que deseas eliminar este producto?")) {
        productos = productos.filter(p => p.id !== id);
        localStorage.setItem('toRico_prods', JSON.stringify(productos));
        renderCatalogo();
        renderAdminList();
      }
    }

    function renderAdminList() {
      const container = document.getElementById('adminProductList');
      container.innerHTML = "";
      productos.forEach(p => {
        const row = document.createElement('div');
        row.style.cssText = "display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding:6px 0;";
        row.innerHTML = `
          <div style="font-size:0.85rem;">
            <strong>${p.nombre}</strong> (${p.cat}) - $${p.usd} USD
          </div>
          <button onclick="eliminarProducto(${p.id})" style="background:#ef4444; color:white; border:none; border-radius:4px; padding:4px 8px; cursor:pointer;">Borrar</button>
        `;
        container.appendChild(row);
      });
    }

    init();
  </script>
</body>
</html>
